# Prefire's device catalog doesn't include iPhone 17 yet; iPhone 16 renders
# the same iPhoneX-class viewport used by the iPhone 17 simulator.
#
# Previews render through AppContainer.fixture() (offline network, fixed clock,
# isolated defaults), so every listed screen snapshots deterministically. The
# custom template (RegionalCheckTests/Support) only adds a short settle delay.
test_configuration:
  target: RegionalCheck
  template_file_path: Support/PreviewTests.stencil
  sources:
    - ${PROJECT_DIR}/RegionalCheck/Views/AboutView.swift
    - ${PROJECT_DIR}/RegionalCheck/Views/HomeView.swift
    - ${PROJECT_DIR}/RegionalCheck/Views/MainTabView.swift
    - ${PROJECT_DIR}/RegionalCheck/Views/MapCardView.swift
    - ${PROJECT_DIR}/RegionalCheck/Views/OnboardingView.swift
    - ${PROJECT_DIR}/RegionalCheck/Views/OutsideUkraineInfoSheet.swift
    - ${PROJECT_DIR}/RegionalCheck/Views/RedesignBottomBar.swift
    - ${PROJECT_DIR}/RegionalCheck/Views/RegionsView.swift
    - ${PROJECT_DIR}/RegionalCheck/Views/StatusView.swift
    - ${PROJECT_DIR}/RegionalCheck/Views/Subscription/PaywallView.swift
  snapshot_devices:
    - iPhone 16
  required_os: 27
  imports:
    - DriveCheckKit
