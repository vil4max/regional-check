# Configuration of `ios-verify`, the gate of the ios-dev plugin.
# key=value, one per line; lines starting with # are comments.

scheme=RegionalCheck
# The workspace adds DriveCheckKit as a root package, so the RegionalCheck test plan can run
# its DriveCheckKitTests target; a bare -project build cannot see a package's test targets.
workspace=RegionalCheck.xcworkspace

# This worktree's own simulator is created on demand from these.
device=iPhone 17
os=27.0

# iPhone only; the app and the widget extension share one App Group.
device_family=1
require_app_group=true

