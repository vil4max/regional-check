<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: transparent; }
    a { color: #E8BA62; } a:hover { color: #F3CF8A; }
  </style>
</helmet>
<div aria-label="{{label}}" style="width: {{px}}; height: {{px}}; border-radius: {{radius}}; overflow: hidden; box-shadow: {{shadow}}; flex-shrink: 0;">
  <svg width="100%" height="100%" viewBox="0 0 100 100" style="display: block;">
    <defs>
      <radialGradient id="{{ids.bg}}" cx="0.5" cy="0.36" r="0.78">
        <stop offset="0" stop-color="{{p.bg1}}"></stop>
        <stop offset="1" stop-color="{{p.bg2}}"></stop>
      </radialGradient>
      <radialGradient id="{{ids.glow}}" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="{{p.accent}}" stop-opacity="0.45"></stop>
        <stop offset="1" stop-color="{{p.accent}}" stop-opacity="0"></stop>
      </radialGradient>
      <radialGradient id="{{ids.dot}}" cx="0.38" cy="0.34" r="0.7">
        <stop offset="0" stop-color="{{p.accent2}}"></stop>
        <stop offset="1" stop-color="{{p.accent}}"></stop>
      </radialGradient>
    </defs>
    <rect width="100" height="100" fill="url(#{{ids.bg}})"></rect>


    <sc-if value="{{is.f}}" hint-placeholder-val="{{ true }}">
      <g>
        <circle cx="50" cy="50" r="30" fill="url(#{{ids.glow}})" fill-opacity="0.7"></circle>
        <sc-for list="{{ring}}" as="t" hint-placeholder-count="60">
          <line x1="{{t.x1}}" y1="{{t.y1}}" x2="{{t.x2}}" y2="{{t.y2}}" stroke="{{p.accent}}" stroke-opacity="{{t.op}}" stroke-width="1.5" stroke-linecap="round"></line>
        </sc-for>
        <circle cx="50" cy="50" r="19" fill="{{p.accent}}" fill-opacity="0.13" stroke="{{p.accent}}" stroke-opacity="0.45" stroke-width="0.7"></circle>
        <circle cx="50" cy="50" r="8.5" fill="url(#{{ids.dot}})"></circle>
      </g>
    </sc-if>
  </svg>
</div>
</x-dc>
<script data-dc-script data-props='{"variant":{"editor":"enum","options":["default","light","dark","tinted","pro"],"default":"default"},"size":{"editor":"int","default":200,"min":16,"max":1024},"$preview":{"width":200,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const variant = this.props.variant ?? 'default';
    const size = Number(this.props.size ?? 200);
    const palettes = {
      default: { bg1: '#1F2A38', bg2: '#07090C', accent: '#7CC39B', accent2: '#C4EBD4' },
      light: { bg1: '#FFFFFF', bg2: '#DCE1E8', accent: '#3E9A68', accent2: '#8FD3AC' },
      dark: { bg1: '#11151B', bg2: '#000000', accent: '#7CC39B', accent2: '#C4EBD4' },
      tinted: { bg1: '#303033', bg2: '#141416', accent: '#FFFFFF', accent2: '#FFFFFF' },
      pro: { bg1: '#2B2213', bg2: '#08090B', accent: '#E8BA62', accent2: '#F8E2B0' }
    };
    const r2 = (n) => Math.round(n * 100) / 100;
    const ring = [];
    for (let i = 0; i < 60; i++) {
      const deg = i * 6;
      const a = (deg - 90) * Math.PI / 180;
      ring.push({
        x1: r2(50 + Math.cos(a) * 29.5), y1: r2(50 + Math.sin(a) * 29.5),
        x2: r2(50 + Math.cos(a) * 34), y2: r2(50 + Math.sin(a) * 34),
        op: r2(0.22 + 0.68 * (0.5 + 0.5 * Math.cos(deg * Math.PI / 180)))
      });
    }
    const uid = variant + '-' + size;
    return {
      p: palettes[variant] || palettes.default,
      is: { f: true },
      ids: { bg: 'bg-' + uid, glow: 'gl-' + uid, dot: 'dt-' + uid },
      ring: ring,
      px: size + 'px',
      radius: Math.round(size * 0.225) + 'px',
      shadow: size >= 120 ? '0 12px 32px rgba(0,0,0,0.45)' : '0 2px 6px rgba(0,0,0,0.35)',
      label: 'Drive Check icon, Mark, ' + variant
    };
  }
}
</script>
</body>
</html>
