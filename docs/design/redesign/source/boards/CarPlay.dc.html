<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #000000; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #6FA8FF; } a:hover { color: #9CC3FF; }
    button { font-family: inherit; }
  </style>
</helmet>
<div style="width: 800px; height: 480px; box-sizing: border-box; background: #000000; color: #FFFFFF; display: flex; flex-direction: column;">
  <nav aria-label="Tabs" style="height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 8px;">
    <a href="#" aria-current="page" style="height: 36px; box-sizing: border-box; padding: 0 18px; border-radius: 18px; background: rgba(255,255,255,0.16); display: flex; align-items: center; gap: 8px; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 600;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.5"></circle><path d="M3.5 10.5h6"></path><path d="M14.5 10.5h6"></path><path d="M12 14.5V21"></path></svg>
      Status
    </a>
    <a href="CarPlayMap.dc.html" style="height: 36px; box-sizing: border-box; padding: 0 18px; border-radius: 18px; display: flex; align-items: center; gap: 8px; color: rgba(235,235,245,0.62); text-decoration: none; font-size: 17px; font-weight: 600;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3z"></path><path d="M9 3v15"></path><path d="M15 6v15"></path></svg>
      Map
    </a>
    <a href="CarPlayDetails.dc.html" style="height: 36px; box-sizing: border-box; padding: 0 18px; border-radius: 18px; display: flex; align-items: center; gap: 8px; color: rgba(235,235,245,0.62); text-decoration: none; font-size: 17px; font-weight: 600;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"></path><path d="M8 12h13"></path><path d="M8 18h13"></path><path d="M3.5 6h.01"></path><path d="M3.5 12h.01"></path><path d="M3.5 18h.01"></path></svg>
      Details
    </a>
  </nav>
  <div style="height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 10px; border-top: 1px solid rgba(255,255,255,0.10); border-bottom: 1px solid rgba(255,255,255,0.10);">
    <svg width="14" height="14" viewBox="0 0 14 14" aria-label="Status marker"><circle cx="7" cy="7" r="6" fill="{{s.dot}}"></circle></svg>
    <span style="font-size: 20px; font-weight: 600;">{{s.title}}</span>
  </div>

  <div style="flex-grow: 1; box-sizing: border-box; padding: 14px 40px 0; display: flex; flex-direction: column; gap: 12px;">
    <sc-for list="{{s.items}}" as="it" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 22px; font-weight: 600; line-height: 27px;">{{it.title}}</span>
        <span style="font-size: 17px; line-height: 22px; color: rgba(235,235,245,0.62);">{{it.detail}}</span>
      </div>
    </sc-for>
  </div>

  <div style="flex-shrink: 0; box-sizing: border-box; padding: 16px 40px 24px; display: flex; gap: 12px;">
    <button style="flex-grow: 1; height: 52px; border: 0; border-radius: 12px; background: #2A2C31; color: #FFFFFF; font-size: 19px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer;">{{s.refresh}}</button>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"phase":{"editor":"enum","options":["clear","alarm","stale"],"default":"clear"},"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const phase = this.props.phase ?? 'clear';
    const table = {
      clear: {
        dot: '#7CC39B', title: 'No Alert', refresh: 'Refresh',
        items: [
          { title: 'Kyiv Oblast', detail: 'Automatic · Updated 14:32' },
          { title: 'No air raid alert in your region', detail: 'Alerts in 3 of 25 regions of Ukraine' },
          { title: 'Nothing nearby', detail: 'Neighboring regions are clear' }
        ]
      },
      alarm: {
        dot: '#F07C7C', title: 'Air Raid Alert', refresh: 'Refresh',
        items: [
          { title: 'Kharkiv Oblast', detail: 'Automatic · Updated 14:32' },
          { title: 'Alert active in your region', detail: 'Alerts in 5 of 25 regions of Ukraine' },
          { title: 'Nearby: Sumy, Poltava', detail: '2 neighboring regions under alert' }
        ]
      },
      stale: {
        dot: '#E8BA62', title: 'No Current Data', refresh: 'Refresh',
        items: [
          { title: 'Kyiv Oblast', detail: 'Automatic · Last update 13:58' },
          { title: 'Last known status: No Alert', detail: 'Data may be outdated — refresh' },
          { title: 'Source: Alert feed', detail: 'Pro' }
        ]
      }
    };
    return { s: table[phase] || table.clear };
  }
}
</script>
</body>
</html>
