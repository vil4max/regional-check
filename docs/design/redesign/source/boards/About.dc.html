<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #0C0E11; font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #F2F3F5; } a:hover { color: #FFFFFF; }
    button { font-family: inherit; }
    .switch { appearance: none; -webkit-appearance: none; margin: 0; width: 51px; height: 31px; border-radius: 16px; background: rgba(255,255,255,0.18); position: relative; cursor: pointer; flex-shrink: 0; }
    .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
    .switch:checked { background: #7CC39B; }
    .switch:checked::after { left: 22px; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0C0E11; color: #F2F3F5;">
  <div style="position: absolute; left: 0; right: 0; top: 58px; height: 44px; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; justify-content: center;">
    <span style="font-size: 17px; font-weight: 600;">About</span>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 122px; display: flex; flex-direction: column; align-items: center; gap: 0;">
    <div style="position: relative; width: 96px; height: 96px;" aria-hidden="true">
      <svg width="96" height="96" viewBox="0 0 156 156" style="position: absolute; inset: 0;"><circle cx="78" cy="78" r="74" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="5" stroke-dasharray="1.6 6.15"></circle></svg>
      <div style="position: absolute; left: 41px; top: 41px; width: 14px; height: 14px; border-radius: 7px; background: #E6E8EC;"></div>
    </div>
    <div style="margin-top: 14px; display: flex; align-items: center; gap: 8px;">
      <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.4px;">Drive Check</h1>
      <sc-if value="{{pro}}" hint-placeholder-val="{{ false }}">
        <span style="font-size: 11px; font-weight: 700; color: #E8BA62; background: rgba(232,186,98,0.16); padding: 3px 7px; border-radius: 8px; letter-spacing: 0.4px;">PRO</span>
      </sc-if>
    </div>
    <p style="margin: 6px 0 0; font-size: 16px; line-height: 22px; color: #E6E8EC; text-align: center; white-space: pre-line;">Regional alert status,
designed for CarPlay.</p>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: {{listTop}}; display: flex; flex-direction: column; gap: 22px;">
    <sc-if value="{{pro}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="padding: 0 4px; font-size: 13px; font-weight: 600; color: #A3A7AE; letter-spacing: 0.3px;">PRO</span>
        <div style="border-radius: 22px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10); overflow: hidden;">
          <label style="box-sizing: border-box; min-height: 60px; padding: 8px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A7AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"></rect><rect x="9" y="5" width="6" height="3" rx="1.5"></rect></svg>
            <span style="flex-grow: 1; display: flex; flex-direction: column;">
              <span style="font-size: 16px; font-weight: 500;">Live Activity during session</span>
              <span style="font-size: 12px; color: #A3A7AE;">Lock Screen and Dynamic Island</span>
            </span>
            <input class="switch" type="checkbox" checked="checked">
          </label>
        </div>
      </div>
    </sc-if>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="padding: 0 4px; font-size: 13px; font-weight: 600; color: #A3A7AE; letter-spacing: 0.3px;">DATA</span>
      <div style="border-radius: 22px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10); overflow: hidden;">
        <a href="https://wiki.ubilling.net.ua/doku.php?id=aerialalertsapi" style="height: 52px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; text-decoration: none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A7AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"></path><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"></path></svg>
          <span style="flex-grow: 1; font-size: 16px; font-weight: 500;">Data source (Ubilling)</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6E737B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"></path><path d="M8 7h9v9"></path></svg>
        </a>
        <div style="box-sizing: border-box; padding: 12px 16px 14px; display: flex; gap: 12px; border-top: 1px solid rgba(255,255,255,0.08);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A7AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-5"></path><path d="M12 8h.01"></path></svg>
          <p style="margin: 0; font-size: 14px; line-height: 19px; color: #A3A7AE;">Alert data is informational only. Do not rely on it for critical decisions.</p>
        </div>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; flex-direction: column; align-items: center; gap: 10px;">
    <button style="width: 100%; height: 56px; box-sizing: border-box; border-radius: 28px; border: 1px solid rgba(255,255,255,0.12); background: rgba(40,43,49,0.72); backdrop-filter: blur(24px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); color: #F2F3F5; font-size: 17px; font-weight: 600; cursor: pointer;">Got It</button>
    <span style="font-size: 12px; color: #A3A7AE; font-variant-numeric: tabular-nums;">Version 3.0.0 (1)</span>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"pro":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pro = this.props.pro ?? false;
    return { pro: pro, listTop: '346px' };
  }
}
</script>
</body>
</html>
