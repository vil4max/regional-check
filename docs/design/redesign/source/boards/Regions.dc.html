<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #0C0E11; font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #E8BA62; } a:hover { color: #F3CF8A; }
    .switch { appearance: none; -webkit-appearance: none; margin: 0; width: 51px; height: 31px; border-radius: 16px; background: rgba(255,255,255,0.18); position: relative; cursor: pointer; flex-shrink: 0; }
    .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
    .switch:checked { background: #7CC39B; }
    .switch:checked::after { left: 22px; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0C0E11; color: #F2F3F5;">
  <div style="box-sizing: border-box; height: 100%; padding: 58px 20px 0; display: flex; flex-direction: column; gap: 14px;">
    <div style="height: 44px; display: flex; align-items: center; justify-content: space-between;">
      <h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.5px;">Regions</h1>
    </div>

    <div style="border-radius: 24px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10); overflow: hidden;">
      <div style="box-sizing: border-box; padding: 14px 16px; display: flex; align-items: center; gap: 12px;">
        <div style="width: 40px; height: 40px; border-radius: 20px; background: rgba(124,195,155,0.16); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7CC39B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 22 2l-9 19-2-8-8-2z"></path></svg>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column;">
          <span style="font-size: 13px; color: #A3A7AE;">Current region</span>
          <span style="font-size: 20px; font-weight: 600;">Kyiv Oblast</span>
        </div>
        <span style="font-size: 14px; font-weight: 600; color: #7CC39B; background: rgba(124,195,155,0.14); padding: 5px 10px; border-radius: 12px;">No Alert</span>
      </div>
      <div style="height: 1px; margin-left: 16px; background: rgba(255,255,255,0.08);"></div>
      <label style="box-sizing: border-box; height: 52px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer;">
        <span style="display: flex; flex-direction: column;">
          <span style="font-size: 16px; font-weight: 500;">Follow location</span>
          <span style="font-size: 12px; color: #A3A7AE;">Switches region as you drive</span>
        </span>
        <input class="switch" type="checkbox" checked="checked">
      </label>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="padding: 0 4px; display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 13px; font-weight: 600; color: #F07C7C; letter-spacing: 0.3px;">ALERT ACTIVE · 3</span>
      </div>
      <div style="border-radius: 22px; background: rgba(240,124,124,0.08); border: 1px solid rgba(240,124,124,0.22); overflow: hidden;">
        <sc-for list="{{alarms}}" as="r" hint-placeholder-count="3">
          <button style="width: 100%; height: 48px; box-sizing: border-box; padding: 0 16px; border: 0; border-top: {{r.line}}; background: transparent; color: #F2F3F5; display: flex; align-items: center; gap: 10px; font-size: 16px; text-align: left; cursor: pointer;">
            <span style="width: 8px; height: 8px; border-radius: 4px; background: #F07C7C; flex-shrink: 0;"></span>
            <span style="flex-grow: 1;">{{r.name}}</span>
            <span style="font-size: 14px; font-weight: 600; color: #F07C7C;">Alert</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="padding: 0 4px; font-size: 13px; font-weight: 600; color: #A3A7AE; letter-spacing: 0.3px;">OTHER REGIONS</span>
      <div style="border-radius: 22px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10); overflow: hidden;">
        <sc-for list="{{others}}" as="r" hint-placeholder-count="7">
          <button style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 16px; border: 0; border-top: {{r.line}}; background: transparent; color: #F2F3F5; display: flex; align-items: center; gap: 10px; font-size: 16px; text-align: left; cursor: pointer;">
            <span style="width: 8px; height: 8px; border-radius: 4px; background: rgba(124,195,155,0.7); flex-shrink: 0;"></span>
            <span style="flex-grow: 1;">{{r.name}}</span>
            <sc-if value="{{r.selected}}" hint-placeholder-val="{{ false }}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8BA62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-label="Selected"><path d="M20 6 9 17l-5-5"></path></svg>
            </sc-if>
          </button>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(rgba(12,14,17,0), #0C0E11 55%); pointer-events: none;"></div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 24px; display: flex; align-items: center; gap: 12px;">
  <nav aria-label="Tabs" style="flex-grow: 1; height: 62px; box-sizing: border-box; padding: 5px; border-radius: 31px; background: rgba(40,43,49,0.72); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.10); box-shadow: 0 12px 34px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.10); display: flex; gap: 4px;">
    <a href="Main.dc.html" style="flex-grow: 1; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #A3A7AE; text-decoration: none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.5"></circle><path d="M3.5 10.5h6"></path><path d="M14.5 10.5h6"></path><path d="M12 14.5V21"></path></svg>
      <span style="font-size: 11px; font-weight: 600;">Status</span>
    </a>
    <a href="#" aria-current="page" style="flex-grow: 1; border-radius: 26px; background: rgba(255,255,255,0.12); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #FFFFFF; text-decoration: none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"></path><path d="M8 12h13"></path><path d="M8 18h13"></path><path d="M3.5 6h.01"></path><path d="M3.5 12h.01"></path><path d="M3.5 18h.01"></path></svg>
      <span style="font-size: 11px; font-weight: 600;">Regions</span>
    </a>
  </nav>
  <button aria-label="Search regions" style="width: 62px; height: 62px; flex-shrink: 0; box-sizing: border-box; padding: 0; border-radius: 31px; border: 1px solid rgba(255,255,255,0.10); background: rgba(40,43,49,0.72); color: #F2F3F5; backdrop-filter: blur(24px); box-shadow: 0 12px 34px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; cursor: pointer;">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
  </button>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const line = (i) => (i === 0 ? '0' : '1px solid rgba(255,255,255,0.08)');
    const alarms = ['Donetsk Oblast', 'Kharkiv Oblast', 'Sumy Oblast'].map((name, i) => ({ name: name, line: line(i) }));
    const others = ['Cherkasy Oblast', 'Chernihiv Oblast', 'Chernivtsi Oblast', 'Dnipropetrovsk Oblast', 'Ivano-Frankivsk Oblast', 'Kherson Oblast', 'Kyiv Oblast', 'Kyiv']
      .map((name, i) => ({ name: name, line: line(i), selected: name === 'Kyiv Oblast' }));
    return { alarms: alarms, others: others };
  }
}
</script>
</body>
</html>
