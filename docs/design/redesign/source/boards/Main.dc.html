<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #0C0E11; font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #E8BA62; } a:hover { color: #F3CF8A; }
    button { font-family: inherit; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0C0E11; color: #F2F3F5;">
  <div style="position: absolute; inset: 0; background: {{s.glow}}; pointer-events: none;"></div>

  <div style="position: relative; box-sizing: border-box; height: 100%; padding: 58px 20px 0; display: flex; flex-direction: column; gap: 0;">

    <div style="height: 44px; display: flex; align-items: center; justify-content: space-between;">
      <button aria-label="Drive Check Pro" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid {{c.navStroke}}; background: {{c.navFill}}; box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.crown}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 10H5z"></path><path d="M5 21h14"></path></svg>
      </button>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.2px;">Drive Check</span>
        <sc-if value="{{pro}}" hint-placeholder-val="{{ true }}">
          <span style="font-size: 11px; font-weight: 700; color: {{c.chipText}}; background: {{c.chipFill}}; padding: 3px 7px; border-radius: 8px; letter-spacing: 0.4px;">PRO</span>
        </sc-if>
      </div>
      <button aria-label="About" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid {{c.navStroke}}; background: {{c.navFill}}; box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9CCD2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-5"></path><path d="M12 8h.01"></path></svg>
      </button>
    </div>

    <div style="margin-top: 14px; display: flex; flex-direction: column; align-items: center; gap: 0;">
      <div style="position: relative; width: 156px; height: 156px; display: flex; align-items: center; justify-content: center;">
        <svg width="156" height="156" viewBox="0 0 156 156" style="position: absolute; inset: 0;"><circle cx="78" cy="78" r="74" fill="none" stroke="{{s.accent}}" stroke-opacity="0.38" stroke-width="5" stroke-dasharray="1.6 6.15"></circle></svg>
        <div style="width: 108px; height: 108px; border-radius: 54px; background: {{s.soft}}; border: 1px solid {{s.edge}}; box-shadow: {{s.shadow}}; display: flex; align-items: center; justify-content: center;">
          <sc-if value="{{is.clear}}" hint-placeholder-val="{{ true }}">
            <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="{{s.accent}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
          </sc-if>
          <sc-if value="{{is.alarm}}" hint-placeholder-val="{{ false }}">
            <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="{{s.accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
          </sc-if>
          <sc-if value="{{is.stale}}" hint-placeholder-val="{{ false }}">
            <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="{{s.accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          </sc-if>
          <sc-if value="{{is.checking}}" hint-placeholder-val="{{ false }}">
            <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="{{s.accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><path d="M21 3v6h-6"></path></svg>
          </sc-if>
        </div>
      </div>

      <h1 style="margin: 14px 0 0; font-size: 38px; line-height: 44px; font-weight: 700; letter-spacing: -0.6px; color: {{s.accent}}; text-align: center;">{{s.title}}</h1>

      <div style="margin-top: 6px; display: flex; flex-direction: column; align-items: center; gap: 2px;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F2F3F5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 22 2l-9 19-2-8-8-2z"></path></svg>
          <span style="font-size: 20px; font-weight: 600;">{{s.region}}</span>
        </div>
        <span style="font-size: 15px; color: #A3A7AE; font-variant-numeric: tabular-nums;">{{s.meta}}</span>
      </div>
    </div>

    <div style="margin-top: 20px; box-sizing: border-box; padding: 16px 18px; border-radius: 24px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A3A7AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path><path d="M19 17v4"></path><path d="M17 19h4"></path></svg>
          <span style="font-size: 13px; font-weight: 600; color: #A3A7AE; letter-spacing: 0.3px;">SUMMARY</span>
        </div>
        <sc-if value="{{pro}}" hint-placeholder-val="{{ true }}">
          <span style="font-size: 13px; color: #A3A7AE;">Source: Alert feed</span>
        </sc-if>
      </div>
      <p style="margin: 0; font-size: 16px; line-height: 22px; color: #E6E8EC;">{{s.summary}}</p>
      <sc-if value="{{s.warn}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 0; font-size: 15px; line-height: 20px; color: #E8BA62;">{{s.warn}}</p>
      </sc-if>
      <div style="height: 1px; background: rgba(255,255,255,0.08);"></div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px;">
          <span style="font-size: 15px; font-weight: 600;">{{s.country}}</span>
          <span style="font-size: 13px; color: #A3A7AE;">Ukraine</span>
        </div>
        <div style="display: flex; gap: 3px;" aria-hidden="true">
          <sc-for list="{{segs}}" as="seg" hint-placeholder-count="25">
            <div style="flex-grow: 1; height: 6px; border-radius: 3px; background: {{seg.bg}};"></div>
          </sc-for>
        </div>
        <span style="font-size: 13px; color: #A3A7AE;">{{s.affected}}</span>
      </div>
    </div>

    <div style="margin-top: 12px; border-radius: 22px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10); overflow: hidden;">
      <sc-if value="{{pro}}" hint-placeholder-val="{{ true }}">
        <div style="height: 52px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.08);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A7AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>
          <div style="flex-grow: 1; display: flex; flex-direction: column;">
            <span style="font-size: 12px; color: #A3A7AE;">Also watching</span>
            <span style="font-size: 16px; font-weight: 500;">{{s.second}}</span>
          </div>
          <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: {{s.secondColor}};"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{s.secondColor}};"></span>{{s.secondStatus}}</span>
        </div>
      </sc-if>
      <a href="#" style="height: 52px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; color: #F2F3F5; text-decoration: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A7AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3z"></path><path d="M9 3v15"></path><path d="M15 6v15"></path></svg>
        <span style="flex-grow: 1; font-size: 16px; font-weight: 500;">Alert map</span>
        <span style="font-size: 14px; color: #A3A7AE;">{{s.mapAge}}</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6E737B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 130px; background: linear-gradient(rgba(12,14,17,0), rgba(12,14,17,0.9) 60%); pointer-events: none;"></div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 24px; display: flex; align-items: center; gap: 12px;">
    <nav aria-label="Tabs" style="flex-grow: 1; height: 62px; box-sizing: border-box; padding: 5px; border-radius: 31px; background: rgba(40,43,49,0.72); backdrop-filter: blur(24px); border: 1px solid {{c.barStroke}}; box-shadow: 0 12px 34px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.10); display: flex; gap: 4px;">
      <a href="#" aria-current="page" style="flex-grow: 1; border-radius: 26px; background: {{c.tabSelFill}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: {{c.tabSelText}}; text-decoration: none;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.5"></circle><path d="M3.5 10.5h6"></path><path d="M14.5 10.5h6"></path><path d="M12 14.5V21"></path></svg>
        <span style="font-size: 11px; font-weight: 600;">Status</span>
      </a>
      <a href="Regions.dc.html" style="flex-grow: 1; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #A3A7AE; text-decoration: none;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"></path><path d="M8 12h13"></path><path d="M8 18h13"></path><path d="M3.5 6h.01"></path><path d="M3.5 12h.01"></path><path d="M3.5 18h.01"></path></svg>
        <span style="font-size: 11px; font-weight: 600;">Regions</span>
      </a>
    </nav>
    <button aria-label="{{s.refresh}}" style="width: 62px; height: 62px; flex-shrink: 0; box-sizing: border-box; padding: 0; border-radius: 31px; border: 1px solid {{s.btnEdge}}; background: {{s.btnBg}}; color: {{s.btnFg}}; backdrop-filter: blur(24px); box-shadow: 0 12px 34px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <sc-if value="{{is.checking}}" hint-placeholder-val="{{ false }}">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8.5" stroke-opacity="0.25"></circle><path d="M12 3.5a8.5 8.5 0 0 1 8.5 8.5"></path></svg>
      </sc-if>
      <sc-if value="{{notChecking}}" hint-placeholder-val="{{ true }}">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><path d="M21 3v6h-6"></path></svg>
      </sc-if>
    </button>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"phase":{"editor":"enum","options":["clear","alarm","stale","checking"],"default":"clear"},"pro":{"editor":"boolean","default":true},"palette":{"editor":"enum","options":["standard","pro"],"default":"standard"},"proAccent":{"editor":"color","default":"#E8BA62","options":["#E8BA62","#EAD7B0","#E3C88F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const phase = this.props.phase ?? 'clear';
    const pro = this.props.pro ?? true;
    const palette = this.props.palette ?? 'standard';
    const pa = this.props.proAccent ?? '#E8BA62';
    const hex = (h, a) => { const n = parseInt(h.slice(1), 16); return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };
    const chrome = palette === 'pro'
      ? { crown: pa, chipText: pa, chipFill: hex(pa, 0.16), navStroke: hex(pa, 0.28), navFill: hex(pa, 0.08), tabSelFill: hex(pa, 0.14), tabSelText: pa, barStroke: hex(pa, 0.22), btnEdgeGlass: hex(pa, 0.28) }
      : { crown: pa, chipText: pa, chipFill: hex(pa, 0.16), navStroke: 'rgba(255,255,255,0.12)', navFill: 'rgba(255,255,255,0.07)', tabSelFill: 'rgba(255,255,255,0.12)', tabSelText: '#FFFFFF', barStroke: 'rgba(255,255,255,0.10)', btnEdgeGlass: 'rgba(255,255,255,0.10)' };
    const tone = (rgb) => ({
      glow: 'radial-gradient(460px 380px at 50% 190px, rgba(' + rgb + ',0.20), rgba(' + rgb + ',0) 72%)',
      soft: 'rgba(' + rgb + ',0.14)',
      edge: 'rgba(' + rgb + ',0.40)',
      shadow: '0 0 60px rgba(' + rgb + ',0.30)'
    });
    const green = '#7CC39B', red = '#F07C7C';
    const glass = { btnBg: 'rgba(40,43,49,0.72)', btnEdge: chrome.btnEdgeGlass, btnFg: '#F2F3F5' };
    const table = {
      clear: Object.assign({
        accent: green, title: 'No Alert', region: 'Kyiv Oblast', meta: 'Automatic · Updated 14:32',
        summary: 'There is currently no air raid alert in the selected region.', warn: '',
        country: 'Alerts in 3 of 25 regions', affected: 'Kharkiv, Sumy, Donetsk',
        second: 'Odesa Oblast', secondStatus: 'No Alert', secondColor: green,
        mapAge: '2 min ago', refresh: 'Refresh', alarms: 3
      }, tone('124,195,155'), glass),
      alarm: Object.assign({
        accent: red, title: 'Air Raid Alert', region: 'Kharkiv Oblast', meta: 'Automatic · Updated 14:32',
        summary: 'An air raid alert is currently active in the selected region.', warn: 'Nearby alerts: Sumy, Poltava',
        country: 'Alerts in 5 of 25 regions', affected: 'Kharkiv, Sumy, Poltava, Donetsk +1',
        second: 'Kyiv Oblast', secondStatus: 'No Alert', secondColor: green,
        mapAge: '1 min ago', refresh: 'Refresh', alarms: 5
      }, tone('240,124,124'), glass),
      stale: Object.assign({
        accent: '#E8BA62', title: 'No Current Data', region: 'Kyiv Oblast', meta: 'Last known: No Alert · 13:58',
        summary: 'Data may be outdated. Refresh to get the latest status.', warn: '',
        country: 'Last known: alerts in 3 of 25', affected: 'Country data is 34 min old',
        second: 'Odesa Oblast', secondStatus: 'Unknown', secondColor: '#9AA0A8',
        mapAge: '34 min ago', refresh: 'Refresh now', alarms: 3,
        btnBg: '#E8BA62', btnEdge: '#E8BA62', btnFg: '#1A1408'
      }, tone('232,186,98')),
      checking: Object.assign({
        accent: '#9AA0A8', title: 'Checking…', region: 'Kyiv Oblast', meta: 'Automatic · Locating',
        summary: 'Updating the latest status…', warn: '',
        country: 'Loading country data', affected: ' ',
        second: 'Odesa Oblast', secondStatus: 'Checking…', secondColor: '#9AA0A8',
        mapAge: 'Loading', refresh: 'Checking…', alarms: 0
      }, tone('154,160,168'), glass)
    };
    const s = table[phase] || table.clear;
    const segs = [];
    for (let i = 0; i < 25; i++) {
      let bg = 'rgba(124,195,155,0.55)';
      if (phase === 'checking') bg = 'rgba(255,255,255,0.10)';
      else if (i < s.alarms) bg = phase === 'stale' ? 'rgba(240,124,124,0.45)' : red;
      else if (phase === 'stale') bg = 'rgba(124,195,155,0.28)';
      segs.push({ bg: bg });
    }
    return {
      s: s,
      c: chrome,
      pro: pro,
      segs: segs,
      notChecking: phase !== 'checking',
      is: { clear: phase === 'clear', alarm: phase === 'alarm', stale: phase === 'stale', checking: phase === 'checking' }
    };
  }
}
</script>
</body>
</html>
