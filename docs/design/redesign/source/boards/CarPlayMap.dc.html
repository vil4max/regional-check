<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #000000; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #6FA8FF; } a:hover { color: #9CC3FF; }
    button { font-family: inherit; }
  </style>
</helmet>
<div style="width: 800px; height: 480px; box-sizing: border-box; background: #000000; color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden;">
  <nav aria-label="Tabs" style="height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.10);">
    <a href="CarPlayAlert.dc.html" style="height: 36px; box-sizing: border-box; padding: 0 18px; border-radius: 18px; display: flex; align-items: center; gap: 8px; color: rgba(235,235,245,0.62); text-decoration: none; font-size: 17px; font-weight: 600;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.5"></circle><path d="M3.5 10.5h6"></path><path d="M14.5 10.5h6"></path><path d="M12 14.5V21"></path></svg>
      Status
    </a>
    <a href="#" aria-current="page" style="height: 36px; box-sizing: border-box; padding: 0 18px; border-radius: 18px; background: rgba(255,255,255,0.16); display: flex; align-items: center; gap: 8px; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 600;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3z"></path><path d="M9 3v15"></path><path d="M15 6v15"></path></svg>
      Map
    </a>
    <a href="CarPlayDetails.dc.html" style="height: 36px; box-sizing: border-box; padding: 0 18px; border-radius: 18px; display: flex; align-items: center; gap: 8px; color: rgba(235,235,245,0.62); text-decoration: none; font-size: 17px; font-weight: 600;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"></path><path d="M8 12h13"></path><path d="M8 18h13"></path><path d="M3.5 6h.01"></path><path d="M3.5 12h.01"></path><path d="M3.5 18h.01"></path></svg>
      Details
    </a>
  </nav>

  <div style="position: relative; flex-grow: 1; background: #15171B; overflow: hidden;">
    <img src="/_blob/f7abc661bd21ba9d9c5bcb3839afa883" alt="Map of Ukraine (MapKit in the real template)" style="position: absolute; left: 230px; top: 20px; width: 580px; height: 381px; object-fit: cover;">

    <sc-for list="{{pins}}" as="p" hint-placeholder-count="5">
      <div style="position: absolute; left: {{p.left}}; top: {{p.top}}; width: {{p.size}}; height: {{p.size}}; box-sizing: border-box; border-radius: 50%; background: {{p.fill}}; border: {{p.border}}; box-shadow: {{p.shadow}};"></div>
    </sc-for>

    <div style="position: absolute; left: 16px; top: 16px; bottom: 16px; width: 264px; box-sizing: border-box; border-radius: 16px; background: rgba(28,30,35,0.94); box-shadow: 0 8px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden;">
      <sc-if value="{{showList}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column;">
          <div style="box-sizing: border-box; padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 20px; font-weight: 700;">Under alert · 5</span>
            <span style="font-size: 14px; color: rgba(235,235,245,0.62);">Updated 14:32</span>
          </div>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
            <button style="height: 56px; box-sizing: border-box; padding: 0 16px; border: 0; border-top: 1px solid rgba(255,255,255,0.08); background: {{r.bg}}; color: #FFFFFF; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer;">
              <span style="width: 12px; height: 12px; border-radius: 6px; background: #F07C7C; flex-shrink: 0;"></span>
              <span style="flex-grow: 1; display: flex; flex-direction: column;">
                <span style="font-size: 17px; font-weight: 600;">{{r.name}}</span>
                <span style="font-size: 13px; color: rgba(235,235,245,0.62);">{{r.note}}</span>
              </span>
            </button>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{showCard}}" hint-placeholder-val="{{ false }}">
        <div style="box-sizing: border-box; height: 100%; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <span style="width: 14px; height: 14px; border-radius: 7px; background: #F07C7C; flex-shrink: 0;"></span>
            <span style="font-size: 22px; font-weight: 700;">Kharkiv Oblast</span>
          </div>
          <span style="font-size: 17px; font-weight: 600;">Air raid alert active</span>
          <span style="font-size: 15px; line-height: 20px; color: rgba(235,235,245,0.70);">Your current region. Nearby: Sumy and Poltava are also under alert.</span>
          <span style="font-size: 14px; color: rgba(235,235,245,0.62);">Updated 14:32</span>
          <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
            <button style="height: 48px; border: 0; border-radius: 12px; background: #3A3D44; color: #FFFFFF; font-size: 17px; font-weight: 600; cursor: pointer;">Refresh</button>
            <button style="height: 48px; border: 0; border-radius: 12px; background: #2A2C31; color: #FFFFFF; font-size: 17px; font-weight: 600; cursor: pointer;">Show Status</button>
          </div>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"selected":{"editor":"boolean","default":false},"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const selected = this.props.selected ?? false;
    const red = '#F07C7C';
    const pin = (x, y, opts) => {
      const size = opts.size;
      return {
        left: (x - size / 2) + 'px',
        top: (y - size / 2) + 'px',
        size: size + 'px',
        fill: opts.fill,
        border: '3px solid #FFFFFF',
        shadow: opts.halo ? '0 0 0 8px rgba(240,124,124,0.30), 0 4px 10px rgba(0,0,0,0.5)' : '0 3px 8px rgba(0,0,0,0.5)'
      };
    };
    const pins = [
      pin(710, 115, { size: selected ? 34 : 28, fill: red, halo: true }),
      pin(636, 90, { size: 22, fill: red }),
      pin(633, 133, { size: 22, fill: red }),
      pin(737, 192, { size: 22, fill: red }),
      pin(769, 147, { size: 22, fill: red })
    ];
    const hi = 'rgba(255,255,255,0.10)';
    const rows = [
      { name: 'Kharkiv Oblast', note: 'Your region', bg: hi },
      { name: 'Sumy Oblast', note: 'Nearby', bg: 'transparent' },
      { name: 'Poltava Oblast', note: 'Nearby', bg: 'transparent' },
      { name: 'Donetsk Oblast', note: ' ', bg: 'transparent' },
      { name: 'Luhansk Oblast', note: ' ', bg: 'transparent' }
    ];
    return { pins: pins, rows: rows, showList: !selected, showCard: selected };
  }
}
</script>
</body>
</html>
