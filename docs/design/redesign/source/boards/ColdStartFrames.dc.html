<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #15181D; font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #E8BA62; } a:hover { color: #F3CF8A; }
  </style>
</helmet>
<div style="width: 1175px; height: 560px; box-sizing: border-box; padding: 32px; background: #15181D; color: #F2F3F5; display: flex; gap: 32px;">
  <sc-for list="{{frames}}" as="fr" hint-placeholder-count="5">
    <div style="width: 195px; display: flex; flex-direction: column; gap: 12px;">
      <div style="width: 195px; height: 422px; overflow: hidden; border-radius: 18px; border: 1px solid rgba(255,255,255,0.10);">
        <div style="width: 390px; height: 844px; transform: scale(0.5); transform-origin: 0 0;">
          <dc-import name="ColdStart" frame="{{fr.id}}" hint-size="390px,844px"></dc-import>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;">{{fr.time}}</span>
        <span style="font-size: 13px; font-weight: 600;">{{fr.title}}</span>
        <span style="font-size: 12px; line-height: 16px; color: #A3A7AE;">{{fr.text}}</span>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1175,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      frames: [
        { id: '0', time: '0 ms', title: 'Launch screen', text: 'Static. Neutral dot: status is unknown yet.' },
        { id: '1', time: '300 ms', title: 'Checking', text: 'Ticks sweep clockwise while the first fetch runs.' },
        { id: '2', time: '≈ 800 ms', title: 'Status known', text: 'Ring takes the status color; dot grows into the disc.' },
        { id: '3', time: '+150 ms', title: 'Symbol', text: 'Symbol springs in; title and cards fade up.' },
        { id: '4', time: '+400 ms', title: 'Ready', text: 'Plain Status screen. Cached fresh status skips the sweep.' }
      ]
    };
  }
}
</script>
</body>
</html>
