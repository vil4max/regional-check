sonar.organization=vil4max
sonar.projectKey=vil4max_regional-check
sonar.projectName=regional-check
sonar.sourceEncoding=UTF-8

sonar.sources=RegionalCheck,RegionalCheckWidgets,Packages/DriveCheckKit/Sources
sonar.tests=RegionalCheckTests,Packages/DriveCheckKit/Tests

# Generated in CI by scripts/sonar-coverage.sh (llvm-cov, includes DriveCheckKit).
sonar.coverageReportPaths=build/ci/sonar/coverage.xml
# Coverage exclusions, approved by the owner path by path (2026-11-10). These files are still
# analysed for bugs and smells; only coverage skips them. The reason for each path is in
# docs/engineering/quality-gate.md, and a new path needs the owner's decision for that path.
sonar.coverage.exclusions=\
  RegionalCheck/App/AppContainerFixture.swift,\
  RegionalCheck/App/FixturePush.swift,\
  RegionalCheck/App/AppDelegate.swift,\
  RegionalCheck/App/RegionalCheckApp.swift,\
  RegionalCheck/LiveActivity/LiveActivityHosting.swift,\
  RegionalCheck/Push/PushPermission.swift,\
  RegionalCheckWidgets/**
