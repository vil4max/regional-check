scheme: RegionalCheck
project: "RegionalCheck.xcodeproj"
workspace: ""
# The shared iOS pipeline (Tooling/docs/ci.md): every harness update rewrites the
# workflows, ci_post_clone.sh and the style files from the Runtime templates.
pipeline: shared
# Each agent session gets its own simulator of this type (Tooling/docs/ci.md, "Baseline").
simulator:
  device_type: iPhone 17
  os: "27.0"
backend:
  prefer: auto
lint: true
format: true
tests: true
todo_scan: false
