disabled_rules:
  - trailing_whitespace
  - blanket_disable_command
opt_in_rules:
  - empty_count
  - force_unwrapping
excluded:
  - Pods
  - .build
  - DerivedData
  # Paths resolve relative to this file; keeps linked worktrees out of the primary checkout lint.
  - ../.claude/worktrees
line_length: 120
identifier_name:
  min_length: 2
cyclomatic_complexity:
  ignores_case_statements: true
function_body_length:
  warning: 80
  error: 120
