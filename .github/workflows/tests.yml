name: Tests and coverage

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
      DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5
      XCODEBUILD_FLAGS: >-
        -project RegionalCheck.xcodeproj
        -scheme RegionalCheck
        -configuration Debug
        -skipPackagePluginValidation
        -skipMacroValidation
        -enableCodeCoverage YES
        -parallel-testing-enabled NO
        CODE_SIGNING_ALLOWED=NO

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Sonar needs history for new-code detection and blame.

      # swift-syntax (a Prefire dependency) takes most of the "Build for testing" time
      # to compile from source; caching DerivedData keeps that build product across runs
      # instead of just the checked-out sources. Falls back to a same-OS cache on a
      # Package.resolved change so Xcode can still reuse whatever didn't change.
      - name: Cache DerivedData
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v6.1.0
        with:
          path: ${{ env.DERIVED_DATA }}
          key: macos-26-deriveddata-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            macos-26-deriveddata-

      - name: Build for testing
        run: |
          xcodebuild $XCODEBUILD_FLAGS -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" build-for-testing

      - name: Unit, ViewModel, and scenario tests
        run: |
          xcodebuild $XCODEBUILD_FLAGS -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath build/results/unit.xcresult \
            test-without-building
          mkdir -p build/coverage
          cp "$(find "$DERIVED_DATA/Build/ProfileData" -name Coverage.profdata | head -1)" build/coverage/unit.profdata

      # Snapshot baselines are recorded on a developer Mac; pixel differences on a
      # different Xcode/GPU must not block coverage, so this step reports but does not fail.
      - name: Snapshot tests
        id: snapshots
        continue-on-error: true
        run: |
          rm -rf "$DERIVED_DATA/Build/ProfileData"
          xcodebuild $XCODEBUILD_FLAGS -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -testPlan Snapshots \
            -resultBundlePath build/results/snapshots.xcresult \
            test-without-building

      - name: Collect snapshot coverage
        if: always()
        run: |
          profile="$(find "$DERIVED_DATA/Build/ProfileData" -name Coverage.profdata 2>/dev/null | head -1)"
          if [ -n "$profile" ]; then cp "$profile" build/coverage/snapshots.profdata; fi

      - name: Convert coverage for Sonar
        run: scripts/sonar-coverage.sh "$DERIVED_DATA" build/sonar/coverage.xml build/coverage/*.profdata

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload test results
        if: failure() || steps.snapshots.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: build/results
          retention-days: 7
