name: Release marker

# A vMAJOR.MINOR.PATCH tag records which commit's build the owner submitted to
# App Review. It requests nothing: after ADR 0013 only a tf- tag starts an Xcode
# Cloud build, and the submitted build is that TestFlight build. This workflow
# moves no branch; it only says whether the tag names the commit it claims. See
# docs/operations/release-process.md.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check, for example v3.0.0
        required: true

permissions:
  actions: read # check-release-tag.sh reads the Tests and coverage run of the tagged commit
  contents: read

concurrency:
  group: release-marker
  cancel-in-progress: false

jobs:
  check-release-tag:
    name: Check release marker tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check marker tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          # The marker is placed after a TestFlight round, so the commit's run
          # finished long ago; waiting the promotion default of 45 minutes would
          # only outlive the job.
          PROMOTE_WAIT_ATTEMPTS: 3
        run: scripts/check-release-tag.sh "$TAG"
